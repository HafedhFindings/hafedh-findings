<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hafedh findings</title>
<style>
:root { --bg:#0b0b0f; --card:#14141c; --muted:#9aa0b4; --text:#f4f4f8; --line:#252532; --accent:#e8c07a; --paper:#f6f1e8; --ink:#1a1714; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 Georgia, serif; }
header { max-width:1100px; margin:0 auto; padding:40px 24px 8px; }
h1 { margin:0 0 8px; }
.sub { color:var(--muted); font-family:system-ui,sans-serif; font-size:14px; }
nav { max-width:1100px; margin:0 auto; padding:8px 24px 16px; display:flex; gap:10px; font-family:system-ui,sans-serif; }
nav a { color:var(--accent); }
section { max-width:1100px; margin:0 auto; padding:8px 24px 32px; }
section h2 { margin:24px 0 12px; font-size:22px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
article { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; padding:14px 16px 16px; }
article img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:10px; background:#1c1c28; }
article h3 { margin:10px 0 6px; font-size:18px; }
.meta { font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); }
.fb { display:inline-block; margin-top:8px; font-family:system-ui,sans-serif; font-size:13px; color:var(--accent); }
.empty { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Hafedh findings</h1>
  <p class="sub">Media and products from the Facebook links you shared</p>
</header>
<nav>
  <a href="#media">Media</a>
  <a href="#products">Products</a>
  <a href="/media/">Media page</a>
  <a href="/products/">Products page</a>
</nav>
<section id="media">
  <h2>Media</h2>
  <div class="grid" id="media-grid"></div>
</section>
<section id="products">
  <h2>Products</h2>
  <div class="grid" id="products-grid"></div>
</section>
<script>
function fbUrl(i) {
  if (!i || !i.facebook) return "";
  if (typeof i.facebook === "string") return i.facebook;
  return i.facebook.share || i.facebook.reel || "";
}
function fbAnchor(i) {
  const u = fbUrl(i);
  return u ? `<a class="fb" href="${u}" target="_blank" rel="noopener">Facebook link</a>` : "";
}
async function load() {
  const [media, products] = await Promise.all([
    fetch("/media/catalog.json").then(r => r.json()),
    fetch("/products/catalog.json").then(r => r.json())
  ]);
  const mg = document.getElementById("media-grid");
  const items = media.items || [];
  mg.innerHTML = items.length ? "" : '<p class="empty">No media yet.</p>';
  items.forEach(i => {
    const el = document.createElement("article");
    const img = i.poster ? `<img src="${i.poster}" alt="">` : "";
    el.innerHTML = `${img}<h3>${i.title}</h3><div class="meta">${i.category || ""} · ${i.genre || ""} · ${i.runtime || ""}</div>${fbAnchor(i)}`;
    mg.appendChild(el);
  });
  const pg = document.getElementById("products-grid");
  const pitems = products.items || [];
  pg.innerHTML = pitems.length ? "" : '<p class="empty">No products yet.</p>';
  pitems.forEach(i => {
    const el = document.createElement("article");
    el.innerHTML = `<h3>${i.title}</h3><div class="meta">${i.category || ""} · ${i.best_price || ""}</div>${fbAnchor(i)}`;
    pg.appendChild(el);
  });
}
load();
</script>
</body>
</html>
