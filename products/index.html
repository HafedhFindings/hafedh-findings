<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produits · Hafedh findings</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("hf-theme")||"light";</script>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#1d1c1a;--muted:#6b6860;--line:#e3e0d8;--accent:#9a5b13;--chip:#f0ece3}
[data-theme=dark]{--bg:#0b0b0f;--card:#15151d;--text:#f2f2f6;--muted:#9aa0b4;--line:#2a2a36;--accent:#e8c07a;--chip:#20202a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font:600 18px Georgia,serif;margin-right:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs a{padding:7px 14px;border-radius:999px;color:var(--muted);text-decoration:none;border:1px solid transparent}
.tabs a.on{color:var(--text);border-color:var(--line);background:var(--card);font-weight:600}
.sub a{font-size:13px;padding:5px 12px}
#theme{margin-left:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.tools{max-width:1200px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
#q{width:100%;max-width:420px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
.tagbar{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);border:1px solid var(--line);cursor:pointer}
.tag.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.count{color:var(--muted);font-size:13px}
main{max-width:1200px;margin:0 auto;padding:16px 20px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
article img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--chip)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
h2{font:600 17px Georgia,serif;margin:0}.meta{font-size:12px;color:var(--muted)}
a{color:var(--accent)}.links{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.empty{grid-column:1/-1;color:var(--muted);padding:40px 0}
.providers a{display:block;font-size:13px;margin:2px 0}
</style>
</head>
<body>
<div class="top"><div class="bar"><span class="brand">Hafedh findings</span>
<nav class="tabs"><a href="/media/" class="">Médias</a><a href="/products/" class="on">Produits</a></nav>
<button id="theme" type="button">☾ Sombre</button></div>
<div class="bar" style="padding-top:0"><nav class="tabs sub" id="subtabs"></nav></div></div>
<div class="tools"><input id="q" type="search" placeholder="Rechercher…"><div class="tagbar" id="tags"></div><div class="count" id="count"></div></div>
<main id="grid"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("hf-theme",t);$("#theme").textContent=t==="dark"?"☀ Clair":"☾ Sombre"}
$("#theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");setTheme(document.documentElement.dataset.theme);
let data={items:[]},sel=new Set();
function tab(){return decodeURIComponent(location.hash.slice(1))||"all"}
function boot(TABS,tabOf,card){
 fetch("catalog.json").then(r=>r.json()).then(d=>{data=d;draw()});
 window.onhashchange=()=>{sel.clear();draw()};$("#q").oninput=draw;
 function draw(){const t=tab();
  $("#subtabs").innerHTML=TABS.map(([id,l])=>{const n=id==="all"?data.items.length:data.items.filter(i=>tabOf(i)===id).length;return `<a href="#${id}" class="${id===t?"on":""}">${l} (${n})</a>`}).join("");
  const inTab=data.items.filter(i=>t==="all"||tabOf(i)===t);
  const freq={};inTab.forEach(i=>(i.tags||[]).forEach(g=>freq[g]=(freq[g]||0)+1));
  const tags=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]||a.localeCompare(b)).slice(0,60);
  $("#tags").innerHTML=tags.map(g=>`<span class="tag ${sel.has(g)?"on":""}" data-t="${esc(g)}">${esc(g)} ${freq[g]}</span>`).join("");
  $("#tags").querySelectorAll(".tag").forEach(e=>e.onclick=()=>{const g=e.dataset.t;sel.has(g)?sel.delete(g):sel.add(g);draw()});
  const q=$("#q").value.toLowerCase().trim();
  const items=inTab.filter(i=>[...sel].every(g=>(i.tags||[]).includes(g))&&(!q||JSON.stringify(i).toLowerCase().includes(q)));
  $("#count").textContent=items.length+" élément(s)";
  $("#grid").innerHTML=items.length?items.map(card).join(""):'<p class="empty">Aucun élément pour ce filtre.</p>';
  $("#grid").querySelectorAll(".tag").forEach(e=>e.onclick=()=>{sel.add(e.dataset.t);draw()});
 }
}
fetch("catalog.json").then(r=>r.json()).then(d=>{
const TABS=[["all","Tout"]].concat((d.categories||[]).map(c=>[c,c[0].toUpperCase()+c.slice(1)]));
boot(TABS,i=>i.category||"autre",i=>`<article><div class="body"><h2>${esc(i.title)}</h2>
 <div class="tagbar">${(i.tags||[]).map(g=>`<span class="tag" data-t="${esc(g)}">${esc(g)}</span>`).join("")}</div>
 <p class="meta">${esc(i.claimed)}</p><div class="providers">${(i.providers||[]).map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noopener"><b>${esc(p.name)}</b> ${esc(p.price||"")} ${esc(p.rating||"")}</a>`).join("")}</div>
 <p class="meta">${esc(i.review_verdict)} · <b>${esc(i.best_price)}</b></p>${i.facebook?`<a class="meta" href="${esc(i.facebook)}" target="_blank" rel="noopener">Clip Facebook</a>`:""}</div></article>`)});
</script></body></html>
